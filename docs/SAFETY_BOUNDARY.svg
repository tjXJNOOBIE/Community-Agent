<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Community Input Is Not Authority</title><desc id="desc">Discord Manager permits bounded observation, signed proposals, external approval, typed Discord effects, and derived audit identities while excluding public AI authority, self-approval, trust-policy mutation, cross-guild actions, and arbitrary Discord operations.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B0F"/><stop offset="1" stop-color="#10151D"/></linearGradient><style>.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}.m{fill:#A8B3C4}.title{font-size:60px;font-weight:760;letter-spacing:-1.1px}.sub{font-size:27px}.head{font-size:30px;font-weight:700}.body{font-size:24px}.small{font-size:21px}.soft{fill:#0D141E;stroke:#263243;stroke-width:2}</style></defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
<text x="82" y="98" class="t title">Community Input Is Not Authority</text><text x="82" y="143" class="t sub m">Observation can be autonomous. Trust and mutation stay explicit.</text>
<rect x="82" y="215" width="680" height="505" rx="32" fill="#0D211D" stroke="#34D399" stroke-width="2"/>
<text x="125" y="280" class="t head">Typed community operations</text>
<g fill="#34D399"><circle cx="137" cy="333" r="6"/><circle cx="137" cy="383" r="6"/><circle cx="137" cy="433" r="6"/><circle cx="137" cy="483" r="6"/><circle cx="137" cy="533" r="6"/><circle cx="137" cy="583" r="6"/><circle cx="137" cy="633" r="6"/></g>
<text x="160" y="341" class="t body">Configured-guild inspection</text><text x="160" y="391" class="t body">Untrusted message observation</text><text x="160" y="441" class="t body">Signed expiring proposals</text><text x="160" y="491" class="t body">External operator approval</text><text x="160" y="541" class="t body">Typed send_message effect</text><text x="160" y="591" class="t body">Claim-before-effect execution</text><text x="160" y="641" class="t body">Derived audit actor identity</text>
<rect x="125" y="665" width="590" height="40" rx="13" fill="#103128"/><text x="291" y="692" class="t small">Known Discord behavior only</text>
<rect x="838" y="215" width="680" height="505" rx="32" fill="#291318" stroke="#FB7185" stroke-width="2"/>
<text x="881" y="280" class="t head">Not model authority</text>
<g fill="#FB7185"><circle cx="893" cy="333" r="6"/><circle cx="893" cy="383" r="6"/><circle cx="893" cy="433" r="6"/><circle cx="893" cy="483" r="6"/><circle cx="893" cy="533" r="6"/><circle cx="893" cy="583" r="6"/><circle cx="893" cy="633" r="6"/></g>
<text x="916" y="341" class="t body">Public chatbot operator access</text><text x="916" y="391" class="t body">Agent self-approval</text><text x="916" y="441" class="t body">Trust-policy mutation</text><text x="916" y="491" class="t body">Cross-guild operations</text><text x="916" y="541" class="t body">Administrator-by-default bot</text><text x="916" y="591" class="t body">Arbitrary Discord mutations</text><text x="916" y="641" class="t body">Wildcard remote browser control</text>
<rect x="881" y="665" width="590" height="40" rx="13" fill="#39171C"/><text x="1055" y="692" class="t small">Authority cannot drift inward</text>
<rect x="365" y="770" width="870" height="92" rx="24" class="soft"/><text x="420" y="810" class="t head">Trust boundary</text><text x="420" y="846" class="t small m">Discord messages may trigger analysis, but only authenticated policy can authorize an effect.</text>
</svg>