<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Discord Manager architecture</title>
  <desc id="desc">An authenticated operator reaches the Discord Manager control plane, which invokes Strands and an internal MCP surface. Deterministic policy and proposal storage control a typed Discord REST mutation.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#334155"/></marker></defs>
  <rect width="1100" height="430" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" font-size="18" fill="#0f172a" text-anchor="middle">
    <rect x="30" y="170" width="150" height="70" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="105" y="200">Human / MCP</text><text x="105" y="225">operator / CLI</text>
    <rect x="230" y="170" width="180" height="70" rx="12" fill="#e0e7ff" stroke="#4f46e5"/><text x="320" y="200">Operator MCP</text><text x="320" y="225">authenticated</text>
    <rect x="460" y="150" width="190" height="110" rx="12" fill="#fef3c7" stroke="#d97706"/><text x="555" y="190">Discord Manager</text><text x="555" y="215">control plane</text><text x="555" y="240">MCP 2025-11-25</text>
    <rect x="700" y="80" width="170" height="70" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="785" y="110">Strands runtime</text><text x="785" y="135">shared bridge</text>
    <rect x="700" y="190" width="170" height="70" rx="12" fill="#f1f5f9" stroke="#64748b"/><text x="785" y="220">Internal MCP</text><text x="785" y="245">observe / propose</text>
    <rect x="700" y="300" width="170" height="70" rx="12" fill="#fee2e2" stroke="#dc2626"/><text x="785" y="330">Policy + claims</text><text x="785" y="355">typed adapter</text>
    <rect x="940" y="190" width="130" height="70" rx="12" fill="#c7d2fe" stroke="#4338ca"/><text x="1005" y="220">Discord</text><text x="1005" y="245">REST API</text>
  </g>
  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M180 205 H230"/><path d="M410 205 H460"/><path d="M650 180 H700"/><path d="M650 220 H700"/><path d="M650 240 C670 280 680 320 700 330"/><path d="M870 335 H940"/>
  </g>
  <text x="40" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Discord Manager — private, approval-gated control plane</text>
</svg>
