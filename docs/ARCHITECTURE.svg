<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Observe, Propose, Approve, Operate</title><desc id="desc">Discord Manager separates untrusted community observations from authenticated operator authority, routes reasoning through Strands, applies deterministic policy, and reaches Discord only through typed actions.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B0F"/><stop offset="1" stop-color="#10151D"/></linearGradient>
<style>.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}.m{fill:#A8B3C4}.title{font-size:60px;font-weight:760;letter-spacing:-1.1px}.sub{font-size:27px}.head{font-size:30px;font-weight:700}.body{font-size:24px}.small{font-size:21px}.card{fill:#111823;stroke:#2B3646;stroke-width:2}.soft{fill:#0D141E;stroke:#263243;stroke-width:2}.line{stroke:#7DD3FC;stroke-width:4;fill:none}.dash{stroke:#A78BFA;stroke-width:4;stroke-dasharray:12 10;fill:none}</style>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7DD3FC"/></marker><marker id="p" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#A78BFA"/></marker>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
<text x="82" y="98" class="t title">Observe, Propose, Approve, Operate</text><text x="82" y="143" class="t sub m">Community content is input. Operator authority is a separate boundary.</text>
<rect x="545" y="210" width="510" height="430" rx="34" fill="#0D1A25" stroke="#5FD6F3" stroke-width="2.5"/>
<text x="590" y="270" class="t head">Deterministic Policy Boundary</text>
<text x="590" y="330" class="t body m">Observe</text><text x="780" y="330" class="t body">No mutation</text>
<text x="590" y="380" class="t body m">Propose</text><text x="780" y="380" class="t body">Signed + expiring</text>
<text x="590" y="430" class="t body m">Approve</text><text x="780" y="430" class="t body">External operator</text>
<text x="590" y="480" class="t body m">Operate</text><text x="780" y="480" class="t body">Typed action only</text>
<text x="590" y="530" class="t body m">Audit</text><text x="780" y="530" class="t body">Derived actor identity</text>
<rect x="590" y="570" width="420" height="44" rx="14" class="soft"/><text x="675" y="599" class="t small">Agent cannot self-approve</text>
<rect x="90" y="240" width="330" height="150" rx="28" class="card"/><text x="125" y="300" class="t head">Discord community</text><text x="125" y="348" class="t body m">Untrusted observations</text>
<rect x="90" y="475" width="330" height="150" rx="28" class="card"/><text x="125" y="535" class="t head">Operator MCP</text><text x="125" y="583" class="t body m">Authenticated authority</text>
<rect x="1180" y="240" width="330" height="150" rx="28" class="card"/><text x="1215" y="300" class="t head">Signed proposal</text><text x="1215" y="348" class="t body m">Claim before effect</text>
<rect x="1180" y="475" width="330" height="150" rx="28" class="card"/><text x="1215" y="535" class="t head">Discord REST</text><text x="1215" y="583" class="t body m">Configured guild only</text>
<rect x="650" y="690" width="300" height="115" rx="28" class="card"/><text x="700" y="744" class="t head">Strands</text><text x="700" y="784" class="t small m">Bounded reasoning loop</text>
<path d="M545 330 L420 315" class="line" marker-end="url(#a)"/><path d="M545 505 L420 550" class="line" marker-end="url(#a)"/><path d="M1055 330 L1180 315" class="line" marker-end="url(#a)"/><path d="M1055 505 L1180 550" class="line" marker-end="url(#a)"/><path d="M800 640 L800 690" class="dash" marker-end="url(#p)"/>
<rect x="90" y="700" width="430" height="105" rx="24" class="soft"/><text x="125" y="744" class="t head">One configured guild</text><text x="125" y="782" class="t small m">Cross-guild activity is rejected.</text>
<rect x="1080" y="700" width="430" height="105" rx="24" class="soft"/><text x="1115" y="744" class="t head">Typed Discord effects</text><text x="1115" y="782" class="t small m">No raw Discord authority.</text>
</svg>