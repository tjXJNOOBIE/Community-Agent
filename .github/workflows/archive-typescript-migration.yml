name: Archive superseded TypeScript backend

on:
  push:
    branches:
      - working/java-first-strands-mcp

permissions:
  contents: write

jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move superseded TypeScript product runtime out of the authoritative root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/typescript/src

          for entry in src/*; do
            case "$entry" in
              src/main|src/test) continue ;;
            esac
            if [ -e "$entry" ]; then
              git mv "$entry" legacy/typescript/src/
            fi
          done

          if [ -d test ]; then
            git mv test legacy/typescript/test
          fi

          for file in package.json package-lock.json tsconfig.json tsconfig.build.json tsconfig.test.json; do
            if [ -e "$file" ]; then
              git mv "$file" legacy/typescript/
            fi
          done

          cat > legacy/typescript/README.md <<'EOF'
          # Superseded TypeScript backend

          This directory preserves the pre-Java Discord Manager implementation as migration/reference evidence only.

          It is **not** the authoritative product runtime, build, install path, MCP server, Discord authority, policy owner, or Strands integration path.

          The root Java application owns the product. Strands runs in the standalone `tjXJNOOBIE/strands-bridge` MCP service and calls Java-owned Function Catalog capabilities over MCP.

          Do not restore these files to the root product architecture. Port any still-useful behavior into the Java-owned domain using current Tavall architecture and tests, then shrink this legacy tree.
          EOF

          if git diff --quiet --cached && git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: archive superseded TypeScript backend"
          git push origin "HEAD:${GITHUB_REF_NAME}"
